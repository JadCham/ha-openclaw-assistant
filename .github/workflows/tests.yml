name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Home Assistant 2026.6 requires Python >= 3.14.2, so the whole matrix targets 3.14.
jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip "ruff==0.15.17"
      - run: ruff check .
      - run: ruff format --check .

  unit:
    name: Unit (pure modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip pytest pytest-asyncio
      - run: python -m compileall custom_components/openclaw_assistant tests
      - run: pytest -q

  integration:
    name: Integration (Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant + test tooling
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          python -m pip install "homeassistant==2026.6.3" \
            "hassil==3.7.0" "home-assistant-intents==2026.6.1"
      - name: Run full suite (incl. HA integration tests)
        run: pytest -q
